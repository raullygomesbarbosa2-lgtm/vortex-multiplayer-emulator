<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Vortex Online — partida</title><style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font:14px system-ui,sans-serif}#bar{height:42px;background:#0b1810;border-bottom:1px solid #25432e;display:flex;align-items:center;justify-content:space-between;padding:0 12px}#title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.state{color:#9bd4aa;font-size:12px}#game{width:100%;height:calc(100% - 43px);background:#000}#err{color:#ffd782;padding:18px}</style></head><body><div id="bar"><span id="title">Carregando…</span><span class="state" id="state">abrindo núcleo</span></div><div id="game"></div><script src="netplay-config.js"></script><script>
const p=new URLSearchParams(location.search),system=p.get('system'),rom=p.get('rom'),name=p.get('name')||'ROM',hex=p.get('id')||'1';document.getElementById('title').textContent=name+' · Vortex Online';
const systems={nes:'nes',snes:'snes',segaMD:'segaMD',segaMS:'segaMS',segaGG:'segaGG',gba:'gba',gb:'gb',gbc:'gbc',n64:'n64',atari2600:'atari2600',arcade:'arcade'};
if(!rom||!systems[system]){document.getElementById('game').innerHTML='<div id="err">Arquivo ou sistema inválido. Volte e selecione a ROM novamente.</div>';throw new Error('Invalid system or ROM URL');}
window.EJS_player='#game';window.EJS_core=systems[system];window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_gameUrl=rom;window.EJS_gameName=name;window.EJS_gameID=parseInt(hex.slice(0,8),16)>>>0;window.EJS_startOnLoaded=true;window.EJS_color='#70ff9b';window.EJS_backgroundColor='#000000';
if(window.VORTEX_NETPLAY_SERVER){window.EJS_netplayServer=window.VORTEX_NETPLAY_SERVER;window.EJS_netplayICEServers=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];document.getElementById('state').textContent='netplay configurado';}else{document.getElementById('state').textContent='netplay em configuração';}
const script=document.createElement('script');script.src=window.EJS_pathtodata+'loader.js';script.onerror=()=>{document.getElementById('game').innerHTML='<div id="err">Não consegui carregar o núcleo. Confira a conexão e tente novamente.</div>';};document.body.appendChild(script);
</script></body></html>
