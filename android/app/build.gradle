plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bytevortex.vortexonline'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bytevortex.vortexonline'
        minSdk 23
        targetSdk 28
        versionCode 6
        versionName '0.6.0-native-netplay-alpha'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    implementation 'com.github.swordfish90:libretrodroid:0.14.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation('io.socket:socket.io-client:2.1.1') { exclude group: 'org.json', module: 'json' }
}
