name: Compilar APK Android
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Compilar APK nativo
        run: gradle --no-daemon -p android assembleDebug
      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Online-Native-NES-SNES-Alpha-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK nativo de teste
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-native-alpha-6
          name: Vortex Online Native Alpha 6 (SNES core)
          prerelease: true
          body: 'Alpha Android nativa sem WebView com núcleos NES QuickNES e Super Nintendo Snes9x (Android ARM64/ARMv7). O seletor abre ROMs próprias .nes/.sfc/.smc e ZIP contendo um desses formatos; nenhuma ROM ou jogo vem incluído. Compilação CI passou; abrir jogo/aparelho real não foi validado. Relay multiplayer experimental, sem sincronização determinística por quadro. Snes9x está sob licença não comercial: não redistribua em produto comercial sem autorização dos titulares.'
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
