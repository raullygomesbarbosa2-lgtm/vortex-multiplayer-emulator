name: Compilar APK Android
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Compilar APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Online-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK Beta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-beta-1
          name: Vortex Online Beta 1
          body: 'Primeiro APK Android do Vortex Online. O APK empacota o site e usa ROMs selecionadas pelo jogador. O netplay foi compilado/configurado, mas a partida entre aparelhos ainda requer validação real. Android 6.0+.'
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
