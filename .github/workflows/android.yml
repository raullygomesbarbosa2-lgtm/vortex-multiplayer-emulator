name: Compilar APK Android
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Compilar APK nativo
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        run: gradle --no-daemon -p android assembleDebug
      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Online-Native-Alpha-9-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK nativo de teste
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-native-alpha-9
          name: Vortex Online Native Alpha 9 (in-game room chat)
          prerelease: true
          body: 'Alpha 9 Android nativa sem WebView, Android 6+ ARM64/ARMv7. NES QuickNES e SNES Snes9x com controles virtuais; ROMs são fornecidas pelo usuário, sem jogos incluídos. Inclui cadastro/login por e-mail e senha e pedido de recuperação via Firebase Authentication. O projeto Firebase precisa ter o provedor E-mail/senha habilitado. O modo solo funciona sem login. Adiciona chat em sobreposição na partida e envia mensagens pela sala via relay de eventos já existente. CI compila o APK; chat remoto ainda precisa de validação com dois aparelhos. Netplay retransmite comandos e não sincroniza deterministicamente os quadros; não considerar gameplay online validado. Snes9x está sob licença não comercial: não redistribua em produto comercial sem autorização dos titulares.'
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
