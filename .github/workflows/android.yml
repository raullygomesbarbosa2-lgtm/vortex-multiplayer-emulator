name: Compilar APK Android
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Compilar APK nativo
        run: gradle --no-daemon -p android assembleDebug
      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Online-Native-Alpha-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK nativo de teste
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-native-alpha-5
          name: Vortex Online Native Alpha 5 (native library fix)
          prerelease: true
          body: 'Alpha nativa sem WebView. Corrige o nome da biblioteca QuickNES para o padrão de extração do Android (lib*.so), além de aceitar ROM NES direta/ZIP com .nes. Relay de comandos verificado com clientes de teste; não há ainda sincronização por quadro/rollback e não foi testada em dois telefones. Android 6+ ARM64/ARMv7.'
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: false
